<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail AI Labeler - Quick Control Center</title>
  
  <link rel="stylesheet" href="../ui/tokens/colors.css">
  <link rel="stylesheet" href="../ui/tokens/typography.css">
  <link rel="stylesheet" href="../ui/tokens/components.css">
  <link rel="stylesheet" href="popup.css">
  
</head>
<body>
  
  <header class="popup-header">
    <div class="header-main">
      <img src="../icon32.png" alt="Logo" class="header-logo">
      <div class="header-text">
        <div class="title-small">AI Workspace</div>
        <div class="label-small" style="color:var(--md-sys-color-on-surface-variant)">Gmail AI Labeler</div>
      </div>
      <div class="status-pill connected">
        <span class="status-dot"></span><span id="globalStatusText">Ready</span>
      </div>
    </div>
  </header>

  <main class="popup-content">
    
    <!-- System Status -->
    <div class="status-section">
      <div class="status-row">
        <div class="status-label">Google</div>
        <div class="status-value success" id="googleStatusText">● Connected</div>
      </div>
      <div class="status-row">
        <div class="status-label">AI</div>
        <div class="status-value success" id="geminiStatusText">● Ready</div>
      </div>
    </div>

    <!-- Active Job (Shown when a background job is running) -->
    <div class="active-job-card" id="activeJobCard" style="display:none;">
      <div class="active-job-header">
        <span class="label-large">⚡ Working...</span>
        <button class="btn-text danger" id="stopJobBtn" style="padding:4px 8px;">Stop</button>
      </div>
      <div class="progress-container" style="margin-top:8px;">
        <div class="progress-bar" id="jobProgressBar" style="width:0%;"></div>
      </div>
      <div class="label-small" id="jobProgressText" style="margin-top:4px; color:var(--md-sys-color-on-surface-variant); text-align:right;"></div>
    </div>

    <!-- Quick Actions -->
    <section class="quick-actions">
      <div class="section-title label-small">Quick Actions</div>
      <div class="action-grid">
        <button class="btn btn-secondary action-btn" id="btnClassifyGmail">Gmail Classify</button>
        <button class="btn btn-secondary action-btn" id="btnSummarizeMail">Summarize</button>
        <button class="btn btn-secondary action-btn" id="btnClassifyCalendar">Calendar Classify</button>
        <button class="btn btn-primary action-btn" id="btnOpenSidePanel">Open Side Panel</button>
      </div>
    </section>

    <!-- Recent Jobs -->
    <section class="recent-jobs">
      <div class="section-title label-small">Recent Activity</div>
      <div class="job-list" id="recentJobsList">
        <!-- Dynamically populated -->
        <div class="label-small" style="text-align:center; color:var(--md-sys-color-on-surface-variant); padding:12px;">No recent activity</div>
      </div>
    </section>

    <!-- Automation -->
    <section class="automation-status">
      <div class="section-title label-small">Automation</div>
      <div class="auto-row">
        <span>Gmail Auto-Classify</span>
        <span class="badge" id="badgeGmailAuto">ON</span>
      </div>
      <div class="auto-row">
        <span>Calendar Auto-Classify</span>
        <span class="badge" id="badgeCalendarAuto">ON</span>
      </div>
    </section>

  </main>

  <footer class="popup-footer">
    <button class="btn btn-text footer-btn" id="btnOpenOptions">⚙️ Settings</button>
    <button class="btn btn-text footer-btn" id="btnOpenDashboard">▣ Full Dashboard</button>
  </footer>

  <!-- 페이지 스크립트가 ES 모듈이라 필요한 것을 스스로 import 한다.
       예전처럼 여러 <script>를 순서대로 나열할 필요가 없다. -->
  <script type="module" src="popup.js"></script>
</body>
</html>
