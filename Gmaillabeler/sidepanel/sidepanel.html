<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace Companion</title>
  
  <link rel="stylesheet" href="../ui/tokens/colors.css">
  <link rel="stylesheet" href="../ui/tokens/typography.css">
  <link rel="stylesheet" href="../ui/tokens/components.css">
  <link rel="stylesheet" href="sidepanel.css">
  
  <script src="../settings/settings_schema.js"></script>
  <script src="../settings/settings_defaults.js"></script>
  <script src="../settings/settings_store.js"></script>
</head>
<body>
  <nav class="service-nav">
    <button class="service-btn active" title="Gmail">
      <span class="service-icon">📧</span>
      <span class="service-label">Gmail</span>
    </button>
    <button class="service-btn" title="Calendar">
      <span class="service-icon">📅</span>
      <span class="service-label">캘린더</span>
    </button>
    <button class="service-btn" title="Drive">
      <span class="service-icon">📁</span>
      <span class="service-label">드라이브</span>
    </button>
    <button class="service-btn" title="Edit">
      <span class="service-icon">✏️</span>
      <span class="service-label">편집</span>
    </button>
    <button class="service-btn" title="Settings">
      <span class="service-icon">⚙️</span>
      <span class="service-label">설정</span>
    </button>
  </nav>

  <main class="sidepanel-content" id="mainContent">
    <div class="progress-section" id="progressSection">
      <span class="label-medium progress-text" id="progressText">0%</span>
      <progress id="progressBar" value="0" max="100" class="progress-bar"></progress>
      <button class="btn-small" id="btnPause" style="background: transparent; border: none; color: #ff9800; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;" title="일시중지">
        <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
          <path d="M520-200v-560h160v560H520Zm-280 0v-560h160v560H240Z"/>
        </svg>
      </button>
      <button class="btn-small" id="btnForceStop" style="background: transparent; border: none; color: #b71c1c; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;" title="강제중지">
        <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
          <path d="M240-240v-480h480v480H240Z"/>
        </svg>
      </button>
    </div>
    
    <div class="action-nav">
      <button class="service-btn" title="Start Labeling">
        <span class="service-icon">▶️</span>
        <span class="service-label">라벨링시작</span>
      </button>
      <button class="service-btn" title="Auto Labeling Settings">
        <span class="service-icon">🤖</span>
        <span class="service-label">자동라벨링설정</span>
      </button>
      <button class="service-btn" title="Label Settings">
        <span class="service-icon">🏷️</span>
        <span class="service-label">라벨설정</span>
      </button>
      <button class="service-btn" title="Empty">
        <span class="service-icon">❓</span>
        <span class="service-label">빈칸</span>
      </button>
      <button class="service-btn" title="Empty">
        <span class="service-icon">❓</span>
        <span class="service-label">빈칸</span>
      </button>
    </div>
  </main>

  <script src="../i18n.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
