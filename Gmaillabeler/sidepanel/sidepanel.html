<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace Companion</title>

  <link rel="stylesheet" href="../ui/tokens/colors.css">
  <link rel="stylesheet" href="../ui/tokens/typography.css">
  <link rel="stylesheet" href="../ui/tokens/components.css">
  <link rel="stylesheet" href="sidepanel.css">

  <script src="../settings/settings_schema.js"></script>
  <script src="../settings/settings_defaults.js"></script>
  <script src="../settings/settings_store.js"></script>
</head>

<body>
  <div class="progress-section" id="progressSection">
    <span class="label-medium progress-text" id="progressText">0%</span>
    <progress id="progressBar" value="0" max="100" class="progress-bar"></progress>
    <button class="btn-small" id="btnPause"
      style="background: transparent; border: none; color: #ff9800; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 2px 4px;"
      title="일시중지">
      <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
        <path d="M520-200v-560h160v560H520Zm-280 0v-560h160v560H240Z" />
      </svg>
    </button>
    <button class="btn-small" id="btnForceStop"
      style="background: transparent; border: none; color: #b71c1c; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 2px 4px;"
      title="강제중지">
      <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
        <path d="M240-240v-480h480v480H240Z" />
      </svg>
    </button>
  </div>

  <div class="service-nav-container" id="serviceNavContainer">
    <nav class="service-nav-track" id="serviceNavTrack">
      <div class="service-page" data-page="0">
        <button class="service-btn active" data-service="gmail" title="Gmail">
          <span class="service-icon">📧</span>
          <span class="service-label">Gmail</span>
        </button>
        <button class="service-btn" data-service="calendar" title="Calendar">
          <span class="service-icon">📅</span>
          <span class="service-label">캘린더</span>
        </button>
        <button class="service-btn" data-service="drive" title="Drive">
          <span class="service-icon">📁</span>
          <span class="service-label">드라이브</span>
        </button>
        <button class="service-btn" data-service="edit" title="Edit">
          <span class="service-icon">✏️</span>
          <span class="service-label">편집</span>
        </button>
        <button class="service-btn" data-service="settings" title="Settings">
          <span class="service-icon">⚙️</span>
          <span class="service-label">설정</span>
        </button>
      </div>
    </nav>
    <div class="drag-edge-zone edge-left" id="dragEdgeLeft" title="이전 페이지">‹</div>
    <div class="drag-edge-zone edge-right" id="dragEdgeRight" title="다음 페이지">›</div>
    <div class="page-indicators" id="pageIndicators"></div>
  </div>

  <div class="nav-resizer" id="navResizer" title="상단바 줄 수 조절 (드래그)">
    <div class="resizer-handle"></div>
  </div>

  <div class="action-nav-container" id="actionNavContainer">
    <nav class="action-nav-track" id="actionNavTrack">
      <div class="action-page" data-page="0">
        <button class="service-btn" data-action="gmail_start" title="Start Labeling">
          <span class="service-icon">▶️</span>
          <span class="service-label">라벨링시작</span>
        </button>
        <button class="service-btn" data-action="gmail_auto_settings" title="Auto Labeling Settings">
          <span class="service-icon">🤖</span>
          <span class="service-label">자동설정</span>
        </button>
        <button class="service-btn" data-action="gmail_label_settings" title="Label Settings">
          <span class="service-icon">🏷️</span>
          <span class="service-label">라벨설정</span>
        </button>
        <button class="service-btn" data-action="gmail_summarize" title="Summarize">
          <span class="service-icon">📝</span>
          <span class="service-label">메일요약</span>
        </button>
        <button class="service-btn" data-action="gmail_clean" title="Clean">
          <span class="service-icon">🧹</span>
          <span class="service-label">메일정리</span>
        </button>
      </div>
    </nav>
    <div class="drag-edge-zone edge-left" id="actionDragEdgeLeft" title="이전 페이지">‹</div>
    <div class="drag-edge-zone edge-right" id="actionDragEdgeRight" title="다음 페이지">›</div>
    <div class="page-indicators" id="actionPageIndicators"></div>
  </div>

  <div class="nav-resizer" id="actionNavResizer" title="중단바 줄 수 조절 (드래그)">
    <div class="resizer-handle"></div>
  </div>

  <main class="sidepanel-content" id="mainContent">
    <div id="panelContainer" class="panel-container"></div>
  </main>

  <script src="../i18n.js"></script>
  <script src="sidepanel.js"></script>
</body>

</html>
