<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gmail AI Labeler 설정</title>
  <style>
    body { margin: 0; padding: 24px; background: #f1f3f4; display: flex; justify-content: center; font-family: 'Segoe UI', sans-serif; }
    @media (prefers-color-scheme: dark) {
      body { background: #131314; }
      .note { color: #9aa0a6; }
      .frame-wrap { background: #1f1f20; }
      .links a { color: #8ab4f8; }
    }
    .wrap { width: 100%; max-width: 420px; }
    .frame-wrap { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.15); overflow: hidden; }
    /* 팝업 화면은 380px 폭 기준으로 만들어져 있어 그대로 두고, 높이만 창 크기에 맞춘다.
       (예전에는 높이가 620px로 고정돼 있어 옵션 페이지에서 아래쪽이 잘렸다) */
    iframe { width: 100%; height: min(620px, calc(100vh - 140px)); min-height: 420px; border: none; display: block; }
    .note { text-align: center; color: #5f6368; font-size: 12px; margin-bottom: 12px; }
    .links { text-align: center; margin-bottom: 12px; font-size: 13px; }
    .links a { color: #1a73e8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="links">
      <!-- 넓은 화면에서 쓰기 좋은 전체 화면 UI는 대시보드다. 옵션 페이지에서는 그쪽을 먼저 안내한다. -->
      <a href="../dashboard/dashboard.html" target="_blank" rel="noopener">대시보드(전체 화면)에서 열기</a>
    </div>
    <div class="note">아래는 툴바 아이콘 클릭 시 뜨는 팝업과 동일한 화면입니다.</div>
    <div class="frame-wrap">
      <iframe src="../popup/popup.html"></iframe>
    </div>
  </div>
</body>
</html>
