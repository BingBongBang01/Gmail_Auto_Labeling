<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>PDF 엔진 자체 점검</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 14px/1.6 system-ui, "Segoe UI", sans-serif;
      margin: 0; padding: 24px; max-width: 900px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; opacity: .7; }
    button {
      font: inherit; padding: 8px 16px; border-radius: 6px;
      border: 1px solid rgba(128,128,128,.4); cursor: pointer;
    }
    button[disabled] { opacity: .5; cursor: default; }
    #status { margin: 16px 0; font-weight: 600; }
    .ok { color: #1a7f37; }
    .fail { color: #b71c1c; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid rgba(128,128,128,.25); }
    th { width: 220px; font-weight: 600; opacity: .8; }
    pre {
      background: rgba(128,128,128,.12); padding: 12px; border-radius: 6px;
      overflow-x: auto; white-space: pre-wrap; word-break: break-all;
    }
    iframe { width: 100%; height: 560px; border: 1px solid rgba(128,128,128,.4); border-radius: 6px; }
  </style>
</head>

<body>
  <h1>PDF 엔진 자체 점검</h1>
  <p class="sub">
    오프스크린 문서에서 MuPDF WASM을 띄우고 <code>열기 → 추출 → 원문 지우기 → 한글 삽입 → 저장</code>이
    한 바퀴 도는지 확인합니다. 이 단계가 통과해야 나머지 이식이 의미가 있습니다.
  </p>
  <p class="sub">
    "OCR 점검"은 표본 PDF를 이미지로 렌더한 뒤 그 이미지에서 글자를 다시 읽어냅니다
    (스캔본과 같은 경로). <code>vendor/tesseract</code>를 넣지 않았으면 여기서 걸립니다 -
    받는 방법은 <code>vendor/README.md</code>에 있습니다.
  </p>

  <button id="run">점검 실행</button>
  <button id="runOcr">OCR 점검</button>
  <button id="shutdown">엔진 종료</button>

  <div id="status"></div>
  <div id="result"></div>

  <script type="module" src="selftest.js"></script>
</body>

</html>
